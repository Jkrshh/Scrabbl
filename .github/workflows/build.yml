name: Build APK

on:
  push:
    branches: [ 'main', 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper JAR
        run: |
          # Le repo contient gradle-wrapper.properties mais pas le .jar (limite API GitHub)
          # On invoque `gradle wrapper` avec la Gradle globale du runner pour créer le .jar
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrabbl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report APK details
        run: |
          echo "### 📦 APK build succeeded" >> $GITHUB_STEP_SUMMARY
          for f in app/build/outputs/apk/debug/*.apk; do
            size=$(du -h "$f" | cut -f1)
            echo "- \`$(basename "$f")\` — $size" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section on this run's page." >> $GITHUB_STEP_SUMMARY
