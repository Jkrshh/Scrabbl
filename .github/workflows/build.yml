name: Build APK

on:
  push:
    branches: [ 'main', 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper JAR
        run: |
          # Le repo contient gradle-wrapper.properties mais pas le .jar (limite API GitHub)
          # On invoque `gradle wrapper` avec la Gradle globale du runner pour créer le .jar
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        id: apk
        run: |
          shortsha="${GITHUB_SHA::7}"
          src=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          dst="scrabbl-debug-${shortsha}.apk"
          cp "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "tag=debug-${shortsha}" >> "$GITHUB_OUTPUT"
          echo "sha=$shortsha" >> "$GITHUB_OUTPUT"
          ls -la "$dst"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrabbl-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create/refresh GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "Scrabbl AI debug (${{ steps.apk.outputs.sha }})"
          body: |
            Build automatique du commit `${{ github.sha }}`.

            Installation sur Android :
            1. Télécharge `${{ steps.apk.outputs.path }}` sur le téléphone.
            2. Autorise les sources inconnues pour ton navigateur/gestionnaire de fichiers.
            3. Ouvre le fichier et installe.

            > APK **debug**, non signé pour Play Store — bon pour usage
            > personnel et sideload.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true

      - name: Report APK details
        run: |
          echo "### 📦 APK build succeeded" >> $GITHUB_STEP_SUMMARY
          size=$(du -h "${{ steps.apk.outputs.path }}" | cut -f1)
          echo "- \`${{ steps.apk.outputs.path }}\` — $size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL** : https://github.com/${{ github.repository }}/releases/tag/${{ steps.apk.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
